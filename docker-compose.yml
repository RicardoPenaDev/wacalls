services:
  wacalls:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wacalls-chat
    restart: unless-stopped
    ports:
      - "8090:8080"
    environment:
      - TZ=America/Sao_Paulo
    volumes:
      - wacalls_data:/data

volumes:
  wacalls_data:
    name: wacalls_chat_data